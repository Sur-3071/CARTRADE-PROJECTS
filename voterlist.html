
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ward Wise Voter Directory</title>

  <link rel="stylesheet" href="voterstyle.css">
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <h1>Ward Wise Voter Directory</h1>
      <p>Search and view voter records across all wards</p>
    </header>


    <!-- FILTER SECTION -->
    <section class="filters">

      <!-- WARD FILTER -->
      <div class="filter-group">

        <label for="wardSelect">
          Select Ward
        </label>

        <select id="wardSelect">
          <option value="ALL">All Wards</option>
        </select>

      </div>


      <!-- NAME SEARCH -->
      <div class="filter-group">

        <label for="searchInput">
          Search Voter Details
        </label>

        <input
          type="search"
          id="searchInput"
          placeholder="Search name, voter number, voter ID..."
          autocomplete="off"
        >

      </div>


      <!-- CLEAR BUTTON -->
      <button
        type="button"
        id="clearBtn"
      >
        Clear Search
      </button>

    </section>


    <!-- RECORDS SECTION -->
    <section class="table-section">

      <!-- TABLE HEADER -->
      <div class="table-heading">

        <div>
          <h2>Voter Records</h2>

          <p>
            All voter details are displayed below
          </p>
        </div>

        <div class="record-count">
          <span id="count">0 Records</span>
        </div>

      </div>


      <!-- STATUS MESSAGE -->
      <div
        id="status"
        class="status"
        hidden
      ></div>


      <!-- TABLE -->
      <div class="table-wrapper">

        <table>

          <thead>

            <tr>
              <th>S.No</th>
              <th>Ward Number</th>
              <th>Voter No</th>
              <th>Voter ID No</th>
              <th>Voter Name</th>
              <th>Relation Type</th>
              <th>Relation Name</th>
              <th>Age</th>
              <th>Gender</th>
              <th>House No</th>
            </tr>

          </thead>


          <tbody id="voterTable">

            <!-- JavaScript loads records here -->

          </tbody>

        </table>

      </div>


      <!-- NO RECORDS MESSAGE -->
      <div
        id="emptyMessage"
        class="empty-message"
        hidden
      >
        No matching voter records found.
      </div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">

      <p>
        Ward Wise Voter Directory
      </p>

    </footer>

  </div>


  <!-- JAVASCRIPT -->
  <script src="voterscript.js"></script>

</body>
</html>

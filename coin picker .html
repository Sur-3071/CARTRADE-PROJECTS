<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tambola Coin Picker</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(rgba(0,0,0,0.7),
            rgba(0,0,0,0.7)),
            url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920&auto=format&fit=crop");

            background-size:cover;
            background-position:center;

            color:white;

            overflow-x:hidden;
        }

        h1{

            text-align:center;

            padding-top:20px;

            font-size:48px;

            color:gold;

            text-shadow:
            0px 0px 10px gold,
            0px 0px 20px orange;
        }

        /* RESTART BUTTON */

        #restartBtn{

            position:fixed;

            top:20px;
            right:20px;

            z-index:999;

            padding:14px 28px;

            border:none;

            border-radius:50px;

            cursor:pointer;

            font-size:18px;

            font-weight:bold;

            color:white;

            background:
            linear-gradient(135deg,
            #ff416c,
            #ff4b2b);

            box-shadow:
            0px 0px 15px #ff416c,
            0px 0px 30px #ff4b2b;

            transition:0.3s;
        }

        #restartBtn:hover{

            transform:scale(1.08);
        }

        #main{

            width:95%;

            margin:auto;

            display:flex;

            flex-direction:column;

            align-items:center;
        }

        /* SETTINGS */

        #tog{

            margin-top:25px;

            padding:20px 30px;

            border-radius:20px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(10px);
        }

        table{

            color:white;
        }

        th,
        td{

            padding:10px 20px;

            text-align:center;
        }

        #auto{

            width:28px;
            height:28px;

            cursor:pointer;
        }

        select{

            padding:10px;

            border-radius:10px;

            border:none;

            outline:none;

            font-size:16px;
        }

        /* BIG COIN */

        #coin{

            margin-top:35px;

            width:220px;
            height:220px;

            border-radius:50%;

            background:
            radial-gradient(circle at top,
            #fff7b1,
            gold,
            orange);

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:95px;

            font-weight:bold;

            color:white;

            border:8px solid #ffd700;

            position:relative;

            overflow:hidden;

            cursor:pointer;

            user-select:none;

            box-shadow:
            0px 0px 30px gold,
            0px 0px 60px orange,
            inset 0px 0px 20px white;

            transform-style:preserve-3d;

            perspective:1000px;

            transition:0.3s;
        }

        #coin:hover{

            transform:scale(1.05);
        }

        #coin::before{

            content:"";

            position:absolute;

            width:120%;
            height:120%;

            background:
            linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.9),
            transparent
            );

            top:-10%;
            left:-120%;

            transform:rotate(25deg);
        }

        .animateCoin{

            animation:
            ultraFastRotate 0.25s linear infinite;
        }

        .animateCoin::before{

            animation:
            shineMove 0.5s linear infinite;
        }

        @keyframes ultraFastRotate{

            0%{

                transform:
                rotateY(0deg);
            }

            100%{

                transform:
                rotateY(-360deg);
            }
        }

        @keyframes shineMove{

            0%{

                left:-120%;
            }

            100%{

                left:120%;
            }
        }

        /* TRACK BOARD */

        #done{

            margin-top:35px;

            padding:25px;

            border-radius:20px;

            background:
            rgba(255,255,255,0.08);

            backdrop-filter:blur(10px);

            box-shadow:
            0px 0px 25px rgba(255,255,255,0.15);
        }

        .row{

            display:flex;
        }

        .col,
        .col1{

            width:72px;
            height:72px;

            margin:5px;

            display:flex;

            justify-content:center;

            align-items:center;

            border-radius:15px;

            font-size:22px;

            font-weight:bold;
        }

        .col{

            background:
            linear-gradient(135deg,
            #00ff87,
            #60efff);

            color:black;

            box-shadow:
            0px 0px 15px #00ff87;
        }

        .col1{

            background:
            rgba(255,255,255,0.15);

            color:white;
        }

        /* HISTORY */

        #historyTitle{

            margin-top:35px;

            font-size:32px;

            color:#00ffff;

            text-shadow:
            0px 0px 10px #00ffff;
        }

        #result{

            margin-top:20px;

            width:95%;

            padding:20px;

            border-radius:20px;

            background:
            rgba(255,255,255,0.08);

            backdrop-filter:blur(10px);

            margin-bottom:40px;
        }

        .historyRow{

            display:flex;

            align-items:center;

            flex-wrap:wrap;

            margin-bottom:15px;
        }

        .historyCoin{

            width:58px;
            height:58px;

            border-radius:50%;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:22px;

            font-weight:bold;

            background:
            linear-gradient(135deg,
            #ffcc00,
            #ff6600);

            color:white;

            box-shadow:
            0px 0px 15px orange,
            inset 0px 0px 10px white;
        }

        .arrowLink{

            font-size:34px;

            margin:0px 10px;

            color:#00ffff;

            text-shadow:
            0px 0px 10px #00ffff;
        }

        /* POPUPS */

        #gameOverPopup,
        #restartConfirmPopup{

            position:fixed;

            top:0;
            left:0;

            width:100%;
            height:100%;

            background:
            rgba(0,0,0,0.85);

            display:flex;

            justify-content:center;

            align-items:center;

            z-index:9999;

            animation:
            fadeIn 0.5s ease;
        }

        #gameOverBox,
        #restartConfirmBox{

            width:420px;

            padding:40px;

            border-radius:30px;

            text-align:center;

            color:white;

            animation:
            popupZoom 0.5s ease;
        }

        #gameOverBox{

            background:
            linear-gradient(135deg,
            #ffcc00,
            #ff6600);

            box-shadow:
            0px 0px 30px gold,
            0px 0px 60px orange;
        }

        #restartConfirmBox{

            background:
            linear-gradient(135deg,
            #141e30,
            #243b55);

            box-shadow:
            0px 0px 30px #00ffff,
            0px 0px 60px #0072ff;
        }

        #gameOverBox h1,
        #restartConfirmBox h1{

            font-size:40px;

            margin-bottom:20px;
        }

        #gameOverBox p,
        #restartConfirmBox p{

            font-size:22px;

            margin-bottom:30px;

            line-height:35px;
        }

        #gameOverBox button,
        #restartBtns button{

            padding:15px 30px;

            border:none;

            border-radius:50px;

            font-size:18px;

            cursor:pointer;

            color:white;

            margin:10px;

            transition:0.3s;
        }

        #gameOverBox button,
        #continueBtn{

            background:
            linear-gradient(135deg,
            #00c6ff,
            #0072ff);
        }

        #endGameBtn{

            background:
            linear-gradient(135deg,
            #ff416c,
            #ff4b2b);
        }

        #gameOverBox button:hover,
        #restartBtns button:hover{

            transform:scale(1.08);
        }

        @keyframes popupZoom{

            0%{

                transform:
                scale(0.3)
                rotate(-15deg);

                opacity:0;
            }

            100%{

                transform:
                scale(1)
                rotate(0deg);

                opacity:1;
            }
        }

        @keyframes fadeIn{

            from{

                opacity:0;
            }

            to{

                opacity:1;
            }
        }

    </style>

</head>

<body>

    <h1>TAMBOLA COIN PICKER</h1>

    <button id="restartBtn"
    onclick="restartGame()">

        🔄 Restart

    </button>

    <div id="main">

        <!-- SETTINGS -->

        <div id="tog">

            <table>

                <tr>

                    <th>Automatic</th>

                    <th>Speed</th>

                </tr>

                <tr>

                    <td>

                        <input type="checkbox"
                        id="auto"
                        onchange="Auto()">

                    </td>

                    <td>

                        <select id="speed">

                            <option value="1000">1 Second</option>
                            <option value="2000">2 Second</option>
                            <option value="3000">3 Second</option>
                            <option value="4000">4 Second</option>
                            <option value="5000">5 Second</option>
                            <option value="6000">6 Second</option>
                            <option value="7000">7 Second</option>
                            <option value="8000">8 Second</option>
                            <option value="9000">9 Second</option>
                            <option value="10000">10 Second</option>

                        </select>

                    </td>

                </tr>

            </table>

        </div>

        <!-- BIG COIN -->

        <div id="coin"
        onclick="coin()">

            🎲

        </div>

        <!-- TRACK -->

        <div id="done"></div>

        <!-- HISTORY -->

        <h2 id="historyTitle">

            Coins Arranged Left To Right

        </h2>

        <div id="result"></div>

    </div>

    <script>

        var a = [];
        var b = [];
        var p = [];

        let isRunning = false;

        let autoInterval = null;

        for(let i=1;i<=90;i++){

            a.push(i);

            b.push(i);
        }

        function coin(){

            if(isRunning || a.length<=0){

                return;
            }

            isRunning=true;

            const randomIndex=
            Math.floor(Math.random()*a.length);

            const finalValue=
            a[randomIndex];

            const val1=
            document.getElementById('coin');

            val1.classList.add("animateCoin");

            let spinAnimation=
            setInterval(()=>{

                let randomTemp=
                Math.floor(Math.random()*90)+1;

                val1.innerHTML=randomTemp;

            },40);

            setTimeout(()=>{

                clearInterval(spinAnimation);

                val1.classList.remove("animateCoin");

                val1.innerHTML=finalValue;

                speakText(finalValue);

                a.splice(randomIndex,1);

                p.push(finalValue);

                updateHistory();

                coin_done();

                isRunning=false;

                if(a.length==0){

                    clearInterval(autoInterval);

                    setTimeout(()=>{

                        showGameOver();

                    },1000);
                }

            },800);
        }

        /* HISTORY */

        function updateHistory(){

            const result=
            document.getElementById("result");

            result.innerHTML="";

            let row=
            document.createElement("div");

            row.className="historyRow";

            for(let i=0;i<p.length;i++){

                let coin=
                document.createElement("div");

                coin.className="historyCoin";

                coin.innerHTML=p[i];

                row.appendChild(coin);

                if(i<p.length-1){

                    let arrow=
                    document.createElement("div");

                    arrow.className="arrowLink";

                    arrow.innerHTML="➜";

                    row.appendChild(arrow);
                }

                if((i+1)%10==0){

                    result.appendChild(row);

                    row=
                    document.createElement("div");

                    row.className="historyRow";
                }
            }

            result.appendChild(row);
        }

        /* SPEAK */

        function speakText(v){

            if('speechSynthesis' in window){

                let speech=
                new SpeechSynthesisUtterance();

                speech.text=v;

                speech.volume=1;

                speech.rate=1;

                speech.pitch=1;

                window.speechSynthesis.speak(speech);
            }
        }

        /* TRACK */

        function coin_done(){

            let c1=
            document.getElementById("done");

            let c=0;

            let c2="";

            for(var i=0;i<9;i++){

                c2+=`<div class='row'>`;

                for(var j=0;j<10;j++){

                    if(p.includes(b[c])){

                        c2+=
                        `<div class='col'>${b[c]}</div>`;
                    }

                    else{

                        c2+=
                        `<div class='col1'>${b[c]}</div>`;
                    }

                    c++;
                }

                c2+=`</div>`;
            }

            c1.innerHTML=c2;
        }

        /* AUTO */

        function Auto(){

            const checkBox =
            document.getElementById("auto");

            const speed =
            document.getElementById("speed");

            clearInterval(autoInterval);

            if(checkBox.checked){

                autoInterval =
                setInterval(()=>{

                    if(!isRunning){

                        coin();
                    }

                }, Number(speed.value));
            }
        }

        /* SPEED CHANGE */

        document
        .getElementById("speed")
        .addEventListener("change", ()=>{

            const checkBox =
            document.getElementById("auto");

            if(checkBox.checked){

                Auto();
            }
        });

        /* GAME OVER */

        function showGameOver(){

            let popup =
            document.createElement("div");

            popup.id =
            "gameOverPopup";

            popup.innerHTML = `

                <div id="gameOverBox">

                    <h1>
                        🏆 GAME OVER 🏆
                    </h1>

                    <p>
                        All 90 Coins Completed
                    </p>

                    <button onclick="restartGame()">

                        🔄 Restart Game

                    </button>

                </div>

            `;

            document.body.appendChild(popup);
        }

        /* RESTART CONFIRM */

        function restartGame(){

            const oldPopup =
            document.getElementById(
            "restartConfirmPopup"
            );

            if(oldPopup){

                oldPopup.remove();
            }

            let popup =
            document.createElement("div");

            popup.id =
            "restartConfirmPopup";

            popup.innerHTML = `

                <div id="restartConfirmBox">

                    <h1>
                        ⚠ Restart Game?
                    </h1>

                    <p>
                        Do you want to end
                        the game or continue?
                    </p>

                    <div id="restartBtns">

                        <button id="endGameBtn"
                        onclick="finalRestart()">

                            ❌ End Game

                        </button>

                        <button id="continueBtn"
                        onclick="closeRestartPopup()">

                            ▶ Continue Game

                        </button>

                    </div>

                </div>

            `;

            document.body.appendChild(popup);
        }

        /* FINAL RESTART */

        function finalRestart(){

            location.reload();
        }

        /* CLOSE POPUP */

        function closeRestartPopup(){

            const popup =
            document.getElementById(
            "restartConfirmPopup"
            );

            if(popup){

                popup.remove();
            }
        }

        coin_done();

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tambola Coin Picker</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(rgba(0, 0, 0, 0.7),
                    rgba(0, 0, 0, 0.7)),
                url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920&auto=format&fit=crop");

            background-size: cover;
            background-position: center;

            color: white;

            overflow-x: hidden;
        }

        h1 {

            text-align: center;

            padding-top: 20px;

            font-size: 48px;

            color: gold;

            text-shadow:
                0px 0px 10px gold,
                0px 0px 20px orange,
                0px 0px 40px yellow;
        }

        #main {

            width: 95%;

            margin: auto;

            display: flex;

            flex-direction: column;

            align-items: center;
        }

        /* BUTTON */

        #btn {

            margin-top: 25px;
        }

        button {

            padding: 18px 45px;

            border: none;

            border-radius: 50px;

            cursor: pointer;

            font-size: 24px;

            color: white;

            background:
                linear-gradient(135deg,
                    #00c6ff,
                    #0072ff);

            box-shadow:
                0px 0px 15px #00c6ff,
                0px 0px 30px #0072ff;

            transition: 0.3s;
        }

        button:hover {

            transform: scale(1.08);

            box-shadow:
                0px 0px 20px #00c6ff,
                0px 0px 50px #0072ff;
        }

        /* SETTINGS */

        #tog {

            margin-top: 25px;

            padding: 20px 30px;

            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(10px);

            box-shadow:
                0px 0px 20px rgba(255,255,255,0.2);
        }

        table {

            color: white;
        }

        th,
        td {

            padding: 10px 20px;

            text-align: center;
        }

        #auto {

            width: 28px;
            height: 28px;

            cursor: pointer;
        }

        select {

            padding: 10px;

            border-radius: 10px;

            border: none;

            outline: none;

            font-size: 16px;
        }

        /* BIG COIN */

        #coin {

            margin-top: 35px;

            width: 240px;
            height: 240px;

            border-radius: 50%;

            background:
                radial-gradient(circle at top,
                    #fff7b1,
                    gold,
                    orange);

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 100px;

            font-weight: bold;

            color: white;

            border: 8px solid #ffd700;

            box-shadow:
                0px 0px 30px gold,
                0px 0px 60px orange,
                inset 0px 0px 20px white;

            transition: 0.3s;

            transform-style: preserve-3d;

            perspective: 1000px;
        }

        /* FAST ROTATION */

        .animateCoin {

            animation: ultraFastRotate 0.25s linear infinite;
        }

        @keyframes ultraFastRotate {

            0% {

                transform:
                    rotateY(0deg);
            }

            100% {

                transform:
                    rotateY(-360deg);
            }
        }

        /* RESULT SECTION */

        #result {

            margin-top: 35px;

            width: 90%;

            min-height: 120px;

            padding: 20px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(10px);

            text-align: center;

            line-height: 70px;
        }

        /* LINKED COINS */

        .coinWrapper {

            display: inline-flex;

            align-items: center;
        }

        .coinLink {

            width: 35px;

            height: 5px;

            margin: 0px 4px;

            border-radius: 10px;

            background:
                linear-gradient(to right,
                    #00ffff,
                    #00ff87);

            box-shadow:
                0px 0px 10px #00ffff;

            animation: glowLink 1s infinite alternate;
        }

        @keyframes glowLink {

            from {

                opacity: 0.5;
            }

            to {

                opacity: 1;
            }
        }

        .pickedCoin {

            display: inline-flex;

            justify-content: center;

            align-items: center;

            width: 60px;
            height: 60px;

            margin: 7px;

            border-radius: 50%;

            background:
                linear-gradient(135deg,
                    #ffcc00,
                    #ff6600);

            font-size: 24px;

            font-weight: bold;

            color: white;

            box-shadow:
                0px 0px 15px orange,
                inset 0px 0px 10px white;

            animation: coinPop 0.6s ease;

            transition: 0.3s;
        }

        .pickedCoin:hover {

            transform: scale(1.15);
        }

        @keyframes coinPop {

            0% {

                transform:
                    scale(0)
                    rotate(0deg);

                opacity: 0;
            }

            50% {

                transform:
                    scale(1.3)
                    rotate(180deg);

                opacity: 1;
            }

            100% {

                transform:
                    scale(1)
                    rotate(360deg);
            }
        }

        /* BOARD */

        #done {

            margin-top: 40px;

            margin-bottom: 50px;

            padding: 25px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(10px);

            box-shadow:
                0px 0px 25px rgba(255,255,255,0.15);
        }

        .row {

            display: flex;
        }

        .col,
        .col1 {

            width: 58px;
            height: 58px;

            margin: 4px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 12px;

            font-weight: bold;

            font-size: 18px;

            transition: 0.3s;
        }

        .col {

            background:
                linear-gradient(135deg,
                    #00ff87,
                    #60efff);

            color: black;

            box-shadow:
                0px 0px 12px #00ff87;

            transform: scale(1.05);
        }

        .col1 {

            background:
                rgba(255, 255, 255, 0.15);

            color: white;
        }

        .col:hover,
        .col1:hover {

            transform: scale(1.12);
        }

        /* MOBILE */

        @media(max-width:768px) {

            h1 {
                font-size: 28px;
            }

            #coin {

                width: 160px;
                height: 160px;

                font-size: 60px;
            }

            .pickedCoin {

                width: 45px;
                height: 45px;

                font-size: 18px;
            }

            .coinLink {

                width: 20px;
            }

            .col,
            .col1 {

                width: 30px;
                height: 30px;

                font-size: 11px;

                margin: 2px;
            }

            button {

                font-size: 18px;

                padding: 14px 25px;
            }
        }

    </style>

</head>

<body>

    <h1>TAMBOLA COIN PICKER</h1>

    <div id="main">

        <div id="btn">

            <button id="generateBtn"
                onclick="coin()">

                🎲 Generate Coin

            </button>

        </div>

        <div id="tog">

            <table>

                <tr>

                    <th>Automatic</th>

                    <th>Speed</th>

                </tr>

                <tr>

                    <td>

                        <input type="checkbox"
                            id="auto"
                            onclick="Auto()">

                    </td>

                    <td>

                        <select id="speed">

                            <option value="1000">
                                1 Second
                            </option>

                            <option value="2000">
                                2 Second
                            </option>

                            <option value="3000">
                                3 Second
                            </option>

                            <option value="4000">
                                4 Second
                            </option>

                            <option value="5000">
                                5 Second
                            </option>

                            <option value="6000">
                                6 Second
                            </option>

                            <option value="7000">
                                7 Second
                            </option>

                            <option value="8000">
                                8 Second
                            </option>

                        </select>

                    </td>

                </tr>

            </table>

        </div>

        <div id="coin">
            🎲
        </div>

        <div id="result"></div>

        <div id="done"></div>

    </div>

    <script>

        var a = [];
        var b = [];
        var p = [];

        let isRunning = false;

        for (let i = 1; i <= 90; i++) {

            a.push(i);

            b.push(i);
        }

        function coin() {

            if (isRunning || a.length <= 0) {

                return;
            }

            isRunning = true;

            const randomIndex =
                Math.floor(Math.random() * a.length);

            const finalValue =
                a[randomIndex];

            const val1 =
                document.getElementById('coin');

            /* START ROTATION */

            val1.classList.add("animateCoin");

            let spinAnimation =
                setInterval(() => {

                    let randomTemp =
                        Math.floor(Math.random() * 90) + 1;

                    val1.innerHTML = randomTemp;

                }, 40);

            /* STOP AFTER 2 SEC */

            setTimeout(() => {

                clearInterval(spinAnimation);

                val1.classList.remove("animateCoin");

                val1.innerHTML = finalValue;

                speakText(finalValue);

                /* REMOVE NUMBER */

                a.splice(randomIndex, 1);

                /* STORE NUMBER */

                p.push(finalValue);

                /* COMPLETE CONNECTED UI */

                const val2 =
                    document.getElementById('result');

                val2.innerHTML = "";

                for (let i = 0; i < p.length; i++) {

                    let wrapper =
                        document.createElement("span");

                    wrapper.className = "coinWrapper";

                    let coinBox =
                        document.createElement("span");

                    coinBox.className = "pickedCoin";

                    coinBox.innerHTML = p[i];

                    wrapper.appendChild(coinBox);

                    val2.appendChild(wrapper);

                    /* ADD LINK BETWEEN ALL NUMBERS */

                    if (i < p.length - 1) {

                        let link =
                            document.createElement("span");

                        link.className = "coinLink";

                        val2.appendChild(link);
                    }

                    /* NEW LINE EVERY 10 */

                    if ((i + 1) % 10 == 0) {

                        val2.appendChild(
                            document.createElement("br")
                        );
                    }
                }

                coin_done();

                /* ENABLE BUTTON */

                isRunning = false;

                /* GAME OVER */

                if (a.length == 0) {

                    setTimeout(() => {

                        alert("Game Over");

                        location.reload();

                    }, 1500);
                }

            }, 2000);
        }

        function speakText(v) {

            if ('speechSynthesis' in window) {

                let speech =
                    new SpeechSynthesisUtterance();

                speech.text = v;

                speech.volume = 1;

                speech.rate = 1;

                speech.pitch = 1;

                window.speechSynthesis.speak(speech);
            }
        }

        function coin_done() {

            let c1 =
                document.getElementById("done");

            let c = 0;

            let c2 = "";

            for (var i = 0; i < 9; i++) {

                c2 += `<div class='row'>`;

                for (var j = 0; j < 10; j++) {

                    if (p.includes(b[c])) {

                        c2 +=
                            `<div class='col'>${b[c]}</div>`;
                    }

                    else {

                        c2 +=
                            `<div class='col1'>${b[c]}</div>`;
                    }

                    c++;
                }

                c2 += `</div>`;
            }

            c1.innerHTML = c2;
        }

        function Auto() {

            var v =
                document.getElementById('auto');

            var sec =
                document.getElementById('speed').value;

            if (v.checked) {

                let autoRun =
                    setInterval(() => {

                        if (!v.checked || a.length <= 0) {

                            clearInterval(autoRun);

                            return;
                        }

                        if (!isRunning) {

                            coin();
                        }

                    }, Number(sec) + 2000);
            }
        }

        coin_done();

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Tambola Coin Picker</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            min-height:100vh;

            background:
            linear-gradient(rgba(0,0,0,0.7),
            rgba(0,0,0,0.7)),
            url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920&auto=format&fit=crop");

            background-size:cover;
            background-position:center;

            color:white;

            overflow-x:hidden;
        }

        h1{

            text-align:center;

            padding-top:20px;

            font-size:48px;

            color:gold;

            text-shadow:
            0px 0px 10px gold,
            0px 0px 20px orange;
        }

        #main{

            width:95%;

            margin:auto;

            display:flex;

            flex-direction:column;

            align-items:center;
        }

        /* SETTINGS */

        #tog{

            margin-top:25px;

            padding:20px 30px;

            border-radius:20px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(10px);
        }

        table{

            color:white;
        }

        th,
        td{

            padding:10px 20px;

            text-align:center;
        }

        #auto{

            width:28px;
            height:28px;

            cursor:pointer;
        }

        select{

            padding:10px;

            border-radius:10px;

            border:none;

            outline:none;

            font-size:16px;
        }

        /* BIG COIN BUTTON */

        #coin{

            margin-top:35px;

            width:220px;
            height:220px;

            border-radius:50%;

            background:
            radial-gradient(circle at top,
            #fff7b1,
            gold,
            orange);

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:95px;

            font-weight:bold;

            color:white;

            border:8px solid #ffd700;

            position:relative;

            overflow:hidden;

            cursor:pointer;

            user-select:none;

            box-shadow:
            0px 0px 30px gold,
            0px 0px 60px orange,
            inset 0px 0px 20px white;

            transform-style:preserve-3d;

            perspective:1000px;

            transition:0.3s;
        }

        #coin:hover{

            transform:scale(1.05);
        }

        #coin::before{

            content:"";

            position:absolute;

            width:120%;
            height:120%;

            background:
            linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,0.9),
            transparent
            );

            top:-10%;
            left:-120%;

            transform:rotate(25deg);
        }

        .animateCoin{

            animation:
            ultraFastRotate 0.25s linear infinite;
        }

        .animateCoin::before{

            animation:
            shineMove 0.5s linear infinite;
        }

        @keyframes ultraFastRotate{

            0%{

                transform:
                rotateY(0deg);
            }

            100%{

                transform:
                rotateY(-360deg);
            }
        }

        @keyframes shineMove{

            0%{

                left:-120%;
            }

            100%{

                left:120%;
            }
        }

        /* TRACK BOARD */

        #done{

            margin-top:35px;

            padding:25px;

            border-radius:20px;

            background:
            rgba(255,255,255,0.08);

            backdrop-filter:blur(10px);

            box-shadow:
            0px 0px 25px rgba(255,255,255,0.15);
        }

        .row{

            display:flex;
        }

        .col,
        .col1{

            width:72px;
            height:72px;

            margin:5px;

            display:flex;

            justify-content:center;

            align-items:center;

            border-radius:15px;

            font-size:22px;

            font-weight:bold;
        }

        .col{

            background:
            linear-gradient(135deg,
            #00ff87,
            #60efff);

            color:black;

            box-shadow:
            0px 0px 15px #00ff87;
        }

        .col1{

            background:
            rgba(255,255,255,0.15);

            color:white;
        }

        /* HISTORY TITLE */

        #historyTitle{

            margin-top:35px;

            font-size:32px;

            color:#00ffff;

            text-shadow:
            0px 0px 10px #00ffff;
        }

        /* HISTORY */

        #result{

            margin-top:20px;

            width:95%;

            padding:20px;

            border-radius:20px;

            background:
            rgba(255,255,255,0.08);

            backdrop-filter:blur(10px);

            margin-bottom:40px;
        }

        .historyRow{

            display:flex;

            align-items:center;

            flex-wrap:nowrap;

            margin-bottom:18px;

            overflow-x:auto;
        }

        .historyCoin{

            min-width:58px;

            height:58px;

            border-radius:50%;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:22px;

            font-weight:bold;

            background:
            linear-gradient(135deg,
            #ffcc00,
            #ff6600);

            color:white;

            box-shadow:
            0px 0px 15px orange,
            inset 0px 0px 10px white;

            animation:coinPop 0.5s ease;
        }

        .arrowLink{

            font-size:34px;

            margin:0px 10px;

            color:#00ffff;

            text-shadow:
            0px 0px 10px #00ffff;
        }

        @keyframes coinPop{

            0%{

                transform:
                scale(0)
                rotate(0deg);

                opacity:0;
            }

            100%{

                transform:
                scale(1)
                rotate(360deg);

                opacity:1;
            }
        }

        /* MOBILE */

        @media(max-width:768px){

            h1{

                font-size:30px;
            }

            #coin{

                width:160px;
                height:160px;

                font-size:60px;
            }

            .col,
            .col1{

                width:38px;
                height:38px;

                font-size:12px;

                margin:2px;
            }

            .historyCoin{

                min-width:42px;

                height:42px;

                font-size:16px;
            }

            .arrowLink{

                font-size:20px;

                margin:0px 5px;
            }

            #historyTitle{

                font-size:24px;
            }
        }

    </style>

</head>

<body>

    <h1>SURESH TAMBOLA COIN PICKER</h1>

    <div id="main">

        <!-- SETTINGS -->

        <div id="tog">

            <table>

                <tr>

                    <th>Automatic</th>

                    <th>Speed</th>

                </tr>

                <tr>

                    <td>

                        <input type="checkbox"
                        id="auto"
                        onclick="Auto()">

                    </td>

                    <td>

                        <select id="speed">

                            <option value="1000">1 Second</option>
                            <option value="2000">2 Second</option>
                            <option value="3000">3 Second</option>
                            <option value="4000">4 Second</option>
                            <option value="5000">5 Second</option>
                            <option value="6000">6 Second</option>
                            <option value="7000">7 Second</option>
                            <option value="8000">8 Second</option>
                            <option value="9000">9 Second</option>
                            <option value="10000">10 Second</option>

                        </select>

                    </td>

                </tr>

            </table>

        </div>

        <!-- BIG COIN CLICK BUTTON -->

        <div id="coin"
        onclick="coin()">

            🎲

        </div>

        <!-- TRACK BOARD -->

        <div id="done"></div>

        <!-- TITLE -->

        <h2 id="historyTitle">

            Coins Arranged Left To Right

        </h2>

        <!-- HISTORY -->

        <div id="result"></div>

    </div>

    <script>

        var a = [];
        var b = [];
        var p = [];

        let isRunning = false;

        for(let i=1;i<=90;i++){

            a.push(i);

            b.push(i);
        }

        function coin(){

            if(isRunning || a.length<=0){

                return;
            }

            isRunning=true;

            const randomIndex=
            Math.floor(Math.random()*a.length);

            const finalValue=
            a[randomIndex];

            const val1=
            document.getElementById('coin');

            /* START SPIN */

            val1.classList.add("animateCoin");

            let spinAnimation=
            setInterval(()=>{

                let randomTemp=
                Math.floor(Math.random()*90)+1;

                val1.innerHTML=randomTemp;

            },40);

            /* STOP AFTER 0.8 SEC */

            setTimeout(()=>{

                clearInterval(spinAnimation);

                val1.classList.remove("animateCoin");

                val1.innerHTML=finalValue;

                speakText(finalValue);

                a.splice(randomIndex,1);

                p.push(finalValue);

                updateHistory();

                coin_done();

                isRunning=false;

                if(a.length==0){

                    setTimeout(()=>{

                        alert("Game Over");

                        location.reload();

                    },1000);
                }

            },800);
        }

        /* HISTORY */

        function updateHistory(){

            const result=
            document.getElementById("result");

            result.innerHTML="";

            let row=
            document.createElement("div");

            row.className="historyRow";

            for(let i=0;i<p.length;i++){

                let coin=
                document.createElement("div");

                coin.className="historyCoin";

                coin.innerHTML=p[i];

                row.appendChild(coin);

                if(i<p.length-1){

                    let arrow=
                    document.createElement("div");

                    arrow.className="arrowLink";

                    arrow.innerHTML="➜";

                    row.appendChild(arrow);
                }

                /* NEXT ROW AFTER 10 */

                if((i+1)%10==0){

                    result.appendChild(row);

                    row=
                    document.createElement("div");

                    row.className="historyRow";
                }
            }

            result.appendChild(row);
        }

        function speakText(v){

            if('speechSynthesis' in window){

                let speech=
                new SpeechSynthesisUtterance();

                speech.text=v;

                speech.volume=1;

                speech.rate=1;

                speech.pitch=1;

                window.speechSynthesis.speak(speech);
            }
        }

        function coin_done(){

            let c1=
            document.getElementById("done");

            let c=0;

            let c2="";

            for(var i=0;i<9;i++){

                c2+=`<div class='row'>`;

                for(var j=0;j<10;j++){

                    if(p.includes(b[c])){

                        c2+=
                        `<div class='col'>${b[c]}</div>`;
                    }

                    else{

                        c2+=
                        `<div class='col1'>${b[c]}</div>`;
                    }

                    c++;
                }

                c2+=`</div>`;
            }

            c1.innerHTML=c2;
        }

        function Auto(){

            var v=
            document.getElementById('auto');

            var sec=
            document.getElementById('speed').value;

            if(v.checked){

                let autoRun=
                setInterval(()=>{

                    if(!v.checked || a.length<=0){

                        clearInterval(autoRun);

                        return;
                    }

                    if(!isRunning){

                        coin();
                    }

                },Number(sec));
            }
        }

        coin_done();

    </script>

</body>

</html>

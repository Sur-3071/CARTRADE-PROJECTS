<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Suresh Tambola Coin Picker</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(rgba(0,0,0,0.7),
    rgba(0,0,0,0.7)),
    url("https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1920&auto=format&fit=crop");

    background-size:cover;
    background-position:center;

    color:white;

    overflow-x:hidden;
}

h1{

    text-align:center;

    padding-top:20px;

    font-size:48px;

    color:gold;

    text-shadow:
    0px 0px 10px gold,
    0px 0px 20px orange;
}

/* RESTART */

#restartBtn{

    position:fixed;

    top:20px;
    right:20px;

    z-index:999;

    padding:14px 28px;

    border:none;

    border-radius:50px;

    cursor:pointer;

    font-size:18px;

    font-weight:bold;

    color:white;

    background:
    linear-gradient(135deg,
    #ff416c,
    #ff4b2b);

    box-shadow:
    0px 0px 15px #ff416c,
    0px 0px 30px #ff4b2b;

    transition:0.3s;
}

#restartBtn:hover{

    transform:scale(1.08);
}

#main{

    width:95%;

    margin:auto;

    display:flex;

    flex-direction:column;

    align-items:center;
}

/* BUTTONS */

#extraControls{

    display:flex;

    gap:15px;

    margin-top:25px;
}

#extraControls button{

    padding:12px 22px;

    border:none;

    border-radius:50px;

    cursor:pointer;

    font-size:16px;

    color:white;

    background:
    linear-gradient(135deg,
    #00c6ff,
    #0072ff);

    box-shadow:
    0px 0px 15px #00c6ff;

    transition:0.3s;
}

#extraControls button:hover{

    transform:scale(1.08);
}

/* BIG COIN */

#coin{

    margin-top:100px;
    margin-bottom:100px;

    width:220px;
    height:220px;

    border-radius:50%;

    background:
    radial-gradient(circle at top,
    #fff7b1,
    gold,
    orange);

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:95px;

    font-weight:bold;

    color:white;

    border:8px solid #ffd700;

    position:relative;

    overflow:hidden;

    cursor:pointer;

    user-select:none;

    box-shadow:
    0px 0px 30px gold,
    0px 0px 60px orange,
    inset 0px 0px 20px white;
}

.animateCoin{

    animation:
    ultraFastRotate 0.25s linear infinite;
}

@keyframes ultraFastRotate{

    0%{
        transform:rotateY(0deg);
    }

    100%{
        transform:rotateY(-360deg);
    }
}

/* LAST FIVE */

#statsBox{

    display:flex;

    justify-content:center;

    margin-top:30px;
}

.statCard{

    min-width:320px;

    padding:25px;

    text-align:center;

    border-radius:20px;

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    box-shadow:
    0px 0px 20px rgba(255,255,255,0.15);
}

.statTitle{

    font-size:22px;

    margin-bottom:18px;
}

#lastFiveContainer{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    flex-wrap:wrap;
}

.lastCoin{

    width:58px;
    height:58px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:22px;

    font-weight:bold;

    color:white;

    background:
    linear-gradient(135deg,
    #ffcc00,
    #ff6600);

    box-shadow:
    0px 0px 15px orange;
}

/* PROGRESS */

#progressContainer{

    width:90%;

    height:24px;

    background:
    rgba(255,255,255,0.12);

    border-radius:50px;

    overflow:hidden;

    margin-top:30px;

    position:relative;
}

#progressBar{

    width:0%;

    height:100%;

    border-radius:50px;

    background:
    linear-gradient(
    90deg,
    #00ff87,
    #00e5ff
    );

    transition:0.5s;

    display:flex;

    justify-content:flex-end;

    align-items:center;

    padding-right:8px;
}

#progressText{

    font-size:14px;

    font-weight:bold;

    color:#003b2f;

    background:
    rgba(255,255,255,0.25);

    padding:2px 7px;

    border-radius:20px;

    backdrop-filter:blur(4px);
}

/* DONE TABLE */

#done{

    margin-top:35px;

    padding:25px;

    border-radius:20px;

    background:
    rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);
}

.row{

    display:flex;

    justify-content:center;
}

.col,
.col1{

    width:60px;
    height:60px;

    margin:4px;

    display:flex;

    justify-content:center;

    align-items:center;

    border-radius:12px;

    font-size:20px;

    font-weight:bold;
}

.col{

    background:
    linear-gradient(135deg,
    #00ff87,
    #60efff);

    color:black;
}

.col1{

    background:
    rgba(255,255,255,0.15);

    color:white;
}

.latestNumber{

    border:3px solid white;
}

/* HISTORY */

#historyTitle{

    margin-top:35px;

    font-size:32px;

    color:#00ffff;
}

#result{

    margin-top:20px;

    width:95%;

    padding:20px;

    border-radius:20px;

    background:
    rgba(255,255,255,0.08);

    margin-bottom:40px;

    display:flex;

    flex-direction:column;

    align-items:center;
}

.historyRow{

    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    margin-bottom:15px;
}

.historyCoin{

    width:50px;
    height:50px;

    border-radius:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:18px;

    font-weight:bold;

    background:
    linear-gradient(135deg,
    #ffcc00,
    #ff6600);

    color:white;
}

.arrowLink{

    font-size:24px;

    margin:0px 8px;

    color:#00ffff;
}

/* POPUPS */

#restartConfirmPopup,
#gameOverPopup{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:
    rgba(0,0,0,0.85);

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:9999;
}

#restartConfirmBox,
#gameOverBox{

    width:420px;

    padding:40px;

    border-radius:30px;

    text-align:center;

    color:white;
}

#restartConfirmBox{

    background:
    linear-gradient(135deg,
    #141e30,
    #243b55);
}

#gameOverBox{

    background:
    linear-gradient(135deg,
    #ffcc00,
    #ff6600);
}

#restartBtns{

    display:flex;

    justify-content:center;

    gap:15px;
}

#restartBtns button{

    padding:15px 28px;

    border:none;

    border-radius:50px;

    font-size:18px;

    cursor:pointer;

    color:white;
}

#continueBtn{

    background:
    linear-gradient(135deg,
    #00c6ff,
    #0072ff);
}

#endGameBtn{

    background:
    linear-gradient(135deg,
    #ff416c,
    #ff4b2b);
}

/* MOBILE */

@media screen and (max-width:768px){

    h1{

        font-size:28px;

        padding-top:80px;
    }

    #coin{

        width:150px;
        height:150px;

        font-size:55px;
    }

    .col,
    .col1{

        width:48px;
        height:48px;

        font-size:15px;
    }

    .historyCoin{

        width:40px;
        height:40px;

        font-size:14px;
    }

    .lastCoin{

        width:42px;
        height:42px;

        font-size:15px;
    }
}

</style>

</head>

<body>

<h1>SURESH TAMBOLA COIN PICKER</h1>

<button id="restartBtn"
onclick="restartGame()">

🔄 Restart

</button>

<div id="main">

<div id="extraControls">

<button onclick="pauseAuto()">
⏸ Pause
</button>

<button onclick="resumeAuto()">
▶ Resume
</button>

</div>

<div id="coin"
onclick="coin()">

🎲

</div>

<div id="statsBox">

<div class="statCard">

<div class="statTitle">
Last 5 Numbers
</div>

<div id="lastFiveContainer">

<div class="lastCoin">-</div>

</div>

</div>

</div>

<div id="progressContainer">

<div id="progressBar">

<div id="progressText">
0
</div>

</div>

</div>

<div id="done"></div>

<h2 id="historyTitle">

Coins Arranged Left To Right

</h2>

<div id="result"></div>

</div>

<script>

var a = [];
var b = [];
var p = [];

let isRunning = false;
let autoInterval = null;
let latestCoin = null;

for(let i=1;i<=90;i++){

    a.push(i);
    b.push(i);
}

/* COIN */

function coin(){

    if(isRunning || a.length<=0){

        return;
    }

    isRunning=true;

    const randomIndex=
    Math.floor(Math.random()*a.length);

    const finalValue=
    a[randomIndex];

    const val1=
    document.getElementById('coin');

    val1.classList.add("animateCoin");

    let spinAnimation=
    setInterval(()=>{

        let randomTemp=
        Math.floor(Math.random()*90)+1;

        val1.innerHTML=randomTemp;

    },40);

    setTimeout(()=>{

        clearInterval(spinAnimation);

        val1.classList.remove("animateCoin");

        val1.innerHTML=finalValue;

        speakText(finalValue);

        a.splice(randomIndex,1);

        p.push(finalValue);

        latestCoin = finalValue;

        updateHistory();

        updateLastFive();

        coin_done();

        let completed =
        90 - a.length;

        let percent =
        (completed/90)*100;

        document.getElementById(
        "progressBar"
        ).style.width =
        percent + "%";

        document.getElementById(
        "progressText"
        ).innerHTML =
        completed + "";

        isRunning=false;

        if(a.length==0){

            clearInterval(autoInterval);

            setTimeout(()=>{

                showGameOver();

            },1000);
        }

    },800);
}

/* SPEAK */

function speakText(v){

    if('speechSynthesis' in window){

        window.speechSynthesis.cancel();

        let speech =
        new SpeechSynthesisUtterance();

        speech.text = v;

        speech.lang = "en-US";

        speech.rate = 0.9;

        speech.pitch = 1;

        speech.volume = 1;

        speechSynthesis.speak(speech);
    }
}

/* HISTORY */

function updateHistory(){

    const result =
    document.getElementById("result");

    result.innerHTML = "";

    let totalPerRow = 6;

    for(let i = 0; i < p.length; i += totalPerRow){

        let row =
        document.createElement("div");

        row.className = "historyRow";

        let rowData =
        p.slice(i, i + totalPerRow);

        rowData.forEach((num, index)=>{

            let coin =
            document.createElement("div");

            coin.className =
            "historyCoin";

            coin.innerHTML = num;

            row.appendChild(coin);

            if(index < rowData.length - 1){

                let arrow =
                document.createElement("div");

                arrow.className =
                "arrowLink";

                arrow.innerHTML = "➜";

                row.appendChild(arrow);
            }
        });

        result.appendChild(row);
    }
}

/* LAST FIVE */

function updateLastFive(){

    let container =
    document.getElementById(
    "lastFiveContainer"
    );

    container.innerHTML = "";

    let lastFive =
    p.slice(-5);

    if(lastFive.length==0){

        container.innerHTML =
        `<div class="lastCoin">-</div>`;

        return;
    }

    lastFive.forEach(num=>{

        container.innerHTML +=
        `<div class="lastCoin">
            ${num}
        </div>`;
    });
}

/* DONE TABLE */

function coin_done(){

    let c1 =
    document.getElementById("done");

    let c = 0;

    let c2 = "";

    for(let i=0;i<10;i++){

        c2 += `<div class='row'>`;

        for(let j=0;j<9;j++){

            let extraClass = "";

            if(b[c] == latestCoin){

                extraClass =
                "latestNumber";
            }

            if(p.includes(b[c])){

                c2 +=
                `<div class='col ${extraClass}'>
                ${b[c]}
                </div>`;
            }

            else{

                c2 +=
                `<div class='col1'>
                ${b[c]}
                </div>`;
            }

            c++;
        }

        c2 += `</div>`;
    }

    c1.innerHTML = c2;
}

/* AUTO */

function resumeAuto(){

    clearInterval(autoInterval);

    autoInterval =
    setInterval(()=>{

        if(!isRunning){

            coin();
        }

    },2500);
}

function pauseAuto(){

    clearInterval(autoInterval);
}

/* RESTART */

function restartGame(){

    let popup =
    document.createElement("div");

    popup.id =
    "restartConfirmPopup";

    popup.innerHTML = `

        <div id="restartConfirmBox">

            <h1>
                ⚠ Restart Game?
            </h1>

            <br>

            <div id="restartBtns">

                <button id="endGameBtn"
                onclick="location.reload()">

                    ❌ Restart

                </button>

                <button id="continueBtn"
                onclick="this.closest('#restartConfirmPopup').remove()">

                    ▶ Continue

                </button>

            </div>

        </div>

    `;

    document.body.appendChild(popup);
}

/* GAME OVER */

function showGameOver(){

    let popup =
    document.createElement("div");

    popup.id =
    "gameOverPopup";

    popup.innerHTML = `

        <div id="gameOverBox">

            <h1>

                🏆 GAME OVER 🏆

            </h1>

            <br>

            <p style="
            font-size:24px;
            line-height:40px;
            ">

                All 90 Coins Completed 🎉

                <br><br>

                New Game Starting
                In 5 Seconds...

            </p>

        </div>

    `;

    document.body.appendChild(popup);

    setTimeout(()=>{

        location.reload();

    },5000);
}

coin_done();

</script>

</body>

</html>
